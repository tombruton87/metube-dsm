# MeTube on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=metube
PKG_TITLE="MeTube"
PKG_DESC="MeTube, the web front end for yt-dlp, in Container Manager: download video or audio from YouTube and many other sites straight into a shared folder on this Synology. A DSM window adds links (several at once), follows the queue with progress, speed and time left, retries failed downloads, keeps the download folder tidy, sets quality, file names and subtitles, shows how to send links from a phone or browser, and keeps yt-dlp current."
APP_ID="MeTube.AppInstance"
REPO=tombruton87/metube-dsm
SERVICES="server"
VOLUMES="state"
IMAGE_VARS="MT_IMAGE"
PORT=8081
PORTS="8081 8082 8091 8181"
HEALTH_PATH=/version
APP_ACTIONS="dladd|dlretry|dlremove|dlclear|dlstart|libdelete|libscan|libclean|defaults|dlfolder|notifyset|dsmtest"
APP_ANSWER_KEYS="DL_DIR_B64 FIRST_IMAGE TEST_SHARES"
APP_REQUEST_KEYS="URLS_B64 DL_KIND DL_QUALITY DL_AFORMAT DL_VFORMAT DL_FOLDER_B64 DL_PLAYLIST DL_PLLIMIT DL_ID_B64 DL_DELFILE DL_WHICH PATHS_B64 CLEAN_DAYS OUT_TPL SUB_MODE SUB_LANGS SUB_AUTO EMBED_THUMB EMBED_META MAX_DL LAN_URLS DL_DIR_B64 NOTIFY_DONE NOTIFY_FAIL"
TAGLINE="video and audio downloader"
WELCOME="MeTube is a web page for yt-dlp: paste a link from YouTube or one of many other sites and it downloads the video, or just the audio, into a shared folder on this Synology. This package runs it in Container Manager and adds a MeTube window to DSM: add several links at once, follow the queue, retry what failed, keep the download folder tidy, choose quality, file names and subtitles, send links from your phone, and keep yt-dlp up to date. Only download what you have the right to, and respect each site's terms."
BACKUP_WHAT="MeTube's own state: the queue, the list of finished and failed downloads, subscriptions and any cookies file you uploaded. Not the downloaded files themselves — they're in your download shared folder, which Hyper Backup can cover."
SITE_NOTE="MeTube's own page, where links can also be added. It has no sign-in of its own: anyone who can reach this address can start downloads, so keep it on your own network, or put it behind DSM's reverse proxy with HTTPS and access control."
ICON_TOP="#ff5c55"
ICON_BOTTOM="#d42a2f"
ICON_LETTER="M"   # only if icon.png is missing
BETA=yes
