<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Send to MeTube</title>
<link rel="icon" href="favicon.ico">
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --card: #fff; --ink: #1d2733; --muted: #66727f; --line: #d8dee5; --red: #d3262c; --ok: #1c7a44; --bad: #b42326; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15191e; --card: #1f252c; --ink: #e7ecf1; --muted: #9aa6b2; --line: #333c46; --ok: #5ad08f; --bad: #ff8a8d; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 14px; display: flex; align-items: center; gap: 10px; }
  h1 i { width: 26px; height: 26px; border-radius: 6px; background: var(--red); display: inline-block; position: relative; }
  h1 i::after { content: ""; position: absolute; left: 10px; top: 7px; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  textarea { width: 100%; min-height: 110px; font: 14px/1.4 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--bg); color: var(--ink); }
  select, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.go { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  ul { list-style: none; padding: 0; margin: 0; } li { padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; } li:last-child { border: 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); font-size: 13px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1><i></i>Send to MeTube</h1>
  <div class="card" id="results" hidden><ul id="list"></ul></div>
  <div class="card" id="form">
    <label for="urls" class="muted">Links, one per line</label>
    <textarea id="urls" placeholder="https://…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="row">
      <select id="kind" aria-label="What to download">
        <option value="video">Video</option>
        <option value="audio">Audio only</option>
      </select>
      <button class="go" id="add">Download</button>
    </div>
  </div>
  <p class="muted">Files go to the download folder set in the MeTube window in DSM. <a href="./">Open MeTube</a> to follow them. Only download what you have the right to, and respect each site's terms.</p>
</main>
<script>
(function () {
  "use strict";
  var CFG = @CONFIG@;
  var $ = function (id) { return document.getElementById(id); };
  var RE = /https?:\/\/[^\s<>"']+/g;
  function links(text) { var m = (text || "").match(RE) || [], seen = {}; return m.filter(function (u) { if (seen[u] || u.length > 1000) return false; seen[u] = 1; return true; }).slice(0, 20); }
  function body(url, kind) {
    if (kind === "audio") return { url: url, download_type: "audio", codec: "auto", format: CFG.aformat, quality: "best", auto_start: true, audio_tags: CFG.thumb ? "with_cover" : CFG.meta ? "no_cover" : "none" };
    return { url: url, download_type: "video", codec: "auto", format: CFG.vformat, quality: CFG.quality, auto_start: true, ytdl_options_presets: CFG.vformat === "mp4" && CFG.thumb ? ["dsm-cover"] : [] };
  }
  function line(url) { var li = document.createElement("li"); li.textContent = "Adding " + url + " …"; $("list").appendChild(li); $("results").hidden = false; return li; }
  function send(list, kind) {
    list.forEach(function (url) {
      var li = line(url);
      fetch("add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body(url, kind)) })
        .then(function (r) { return r.text().then(function (t) { var j = {}; try { j = JSON.parse(t); } catch (e) { j = { status: r.ok ? "ok" : "error", msg: t }; } if (!r.ok) j.status = "error"; return j; }); })
        .then(function (j) { li.className = j.status === "error" ? "bad" : "ok"; li.textContent = (j.status === "error" ? "✗ " + url + " — " + String(j.msg || "MeTube refused it").replace(/^ERROR: /, "").slice(0, 200) : "✓ " + url + " — downloading"); })
        .catch(function () { li.className = "bad"; li.textContent = "✗ " + url + " — MeTube couldn't be reached"; });
    });
  }
  $("kind").value = CFG.kind === "audio" ? "audio" : "video";
  var q = new URLSearchParams(location.search), given = links([q.get("url"), q.get("text"), q.get("title")].join(" "));
  var kind = q.get("kind") === "audio" ? "audio" : q.get("kind") === "video" ? "video" : $("kind").value;
  // A link arriving here fills the box; it downloads on a tap of Download, never by itself (any page could link here).
  if (given.length) { $("urls").value = given.join("\n"); $("kind").value = kind; $("add").focus(); try { history.replaceState(null, "", location.pathname); } catch (e) { /* fine */ } }
  $("add").onclick = function () { var l = links($("urls").value); if (!l.length) { $("urls").focus(); return; } send(l, $("kind").value); $("urls").value = ""; };
})();
</script>
</body>
</html>
